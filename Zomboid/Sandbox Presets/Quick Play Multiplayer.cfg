# Default 64. Min: 0 Max: 64 Default: 64
MinidoracatAutoDrive.SummonMaxDistance=64

# In multiplayer, players only receive other vehicles within roughly 64–88 tiles, so two cars meeting at speed see each other only 1–2 seconds before they meet. When enabled, the server also tells each auto-driving player about moving, driven vehicles up to 300 tiles ahead, so auto-drive can keep right or slow down early. Final avoidance still uses the vehicle positions the game itself syncs.
# Usually under 2 KB/s per auto-driving player, up to about 5 KB/s with many vehicles nearby; nothing is sent when no vehicle is nearby. Enabled by default.
# Takes effect as soon as an admin clicks Apply.
MinidoracatAutoDrive.TrafficRelay=true

# Adds sensor diagnostics: red circles are hard obstacles, orange marks the nearest moving vehicle, and green dots are road-band edges. The regular translucent blue/yellow trajectory is controlled in MOD Options or the mini-map's Autodrive section; this option controls diagnostic markers only. It adds a small client rendering cost, so keep it off normally. Applies immediately after an admin clicks Apply.
MinidoracatAutoDrive.DebugOverlay=false

# When enabled, players' games keep the last few seconds of auto-drive data in memory and send short clips to the server only when something goes wrong (stuck, collision, emergency braking, takeover after a problem), plus a small summary of each drive.
# Nothing is written to players' disks. Files are stored on the server under Zomboid/Lua/MinidoracatAutoDrive/Uploads/, one folder per player, with index.txt listing every clip.
