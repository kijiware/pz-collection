MinidoracatAutoDrive.SpawnAutopilot=true

# Adjusts power used by active GPS navigation only. The default 50 is half the base rate; 100 is the base rate, 200 is double, and 0 disables this drain.
# An installed GPS uses the vehicle battery; a carried GPS uses its own battery. While the engine runs, the vanilla alternator charges at the same time; throughout the 0–500 range the battery still gains net charge, while the multiplier changes recharge speed.
# GPS and auto-drive power loads are added when both are active.
# Takes effect as soon as an admin clicks Apply. Min: 0 Max: 500 Default: 50
MinidoracatAutoDrive.GPSPowerPercent=50

# Adjusts the vehicle-battery load while auto-drive is active only. The default 50 is half the base rate; 100 is the base rate, 200 is double, and 0 disables this drain.
# Auto-drive requires the running engine, so the vanilla alternator charges at the same time; throughout the 0–500 range the battery still gains net charge, while the multiplier changes recharge speed. This load is added to the GPS load.
# Takes effect as soon as an admin clicks Apply. Min: 0 Max: 500 Default: 50
MinidoracatAutoDrive.AutoDrivePowerPercent=50

# Adds fuel use while the driver navigates the vehicle with either an installed or a charged carried GPS. The default 50 adds 2.5% to that vehicle's vanilla fuel burn; 100 adds 5%, 200 adds 10%, and 0 adds nothing.
# A carried GPS still draws from its own battery; GPS and auto-drive fuel additions are summed when both are active.
# Takes effect as soon as an admin clicks Apply. Min: 0 Max: 500 Default: 50
MinidoracatAutoDrive.GPSFuelPercent=50

# Adds fuel use only while auto-drive is active. The default 50 adds 12.5% to that vehicle's vanilla fuel burn; 100 adds 25%, 200 adds 50%, and 0 adds nothing.
# With GPS and auto-drive both at the default, the total addition is 15%; vanilla burn is not deducted twice.
# During auto-drive, the vanilla burn is counted in the gear you would use at that speed when driving yourself, so slowing for bends and obstacles burns no extra fuel.
# Takes effect as soon as an admin clicks Apply. Min: 0 Max: 500 Default: 50
MinidoracatAutoDrive.AutoDriveFuelPercent=50

# When enabled (default), installing or removing a GPS Navigator or Autopilot Module on a vehicle requires Electrical 1.
# A screwdriver and a vehicle battery are always required regardless of this setting.
# Disabled means anyone can install and remove the devices.
# Takes effect as soon as an admin clicks Apply.
MinidoracatAutoDrive.InstallSkillGate=true

# Highest speed allowed while auto-driving.
# Lower values are safer and less likely to hit obstacles; higher values are faster but riskier.
# Actual speed is still limited by road conditions, vehicle performance and cornering slowdown.
# After an admin clicks Apply, restart auto-drive to use the new limit. Min: 5 Max: 120 Default: 120
MinidoracatAutoDrive.AutoDriveMaxSpeed=120

# Detection range: individual zombies from 2 metres ahead out to autodrive's actual sensing distance (each player's “Base sensing distance” option, 48–200 metres, default 120; shorter when the frame rate is very low) and within 3 metres to either side of the driving line.
# When enabled, zombies that cannot be avoided (no gap, blocked by an obstacle, or “Avoid zombies and corpses” off) cap speed by count: 1–3 at 35, 4–7 at 25, 8 or more at 15 km/h; zombies it can dodge cause no slowdown. Zombies are not obstacles, so auto-drive will not stop for them.
# Force slowdown applies this to everyone; Player choice (default) lets each player use the HUD/options; No zombie slowdown removes only this dedicated cap, while every other safety limit remains active.
# Takes effect as soon as an admin clicks Apply. Default = Player choice
    -- 1 = Force slowdown
    -- 2 = Player choice
    -- 3 = No zombie slowdown
MinidoracatAutoDrive.ZombieAreaSlowdown=2

# Detection range: corpses on the ground from 2 metres ahead out to autodrive's actual sensing distance (each player's “Base sensing distance” option, 48–200 metres, default 120; shorter when the frame rate is very low) and within 3 metres to either side of the driving line.
# When enabled, corpses that cannot be avoided (no gap, blocked by an obstacle, or “Avoid zombies and corpses” off) cap speed at 30 km/h, with no further tiers; corpses it can dodge cause no slowdown. Corpses are not obstacles, so auto-drive will not stop for them.
# Force slowdown applies this to everyone; Player choice (default) lets each player use the HUD/options; No corpse slowdown removes only this dedicated cap, while every other safety limit remains active.
# Takes effect as soon as an admin clicks Apply. Default = Player choice
    -- 1 = Force slowdown
    -- 2 = Player choice
    -- 3 = No corpse slowdown
MinidoracatAutoDrive.CorpseSlowdown=2

# Selected animals are protected: auto-drive always steers around them. If the player's “Avoid animals” option does not cover them, it slows down first and then steers around them gently.
# Only when there is truly no room does it stop in front of the animal and wait for it to move away; if the wait drags on, it creeps past at a very low speed (a low-speed bump does not damage the vehicle, but the animal can still be hurt). If the animal keeps blocking the way, auto-drive hands control back to the player.
# Large animals (default) = deer, sheep, pigs, cows and the like, plus young animals that have grown large; All animals = small animals such as chickens, rabbits and turkeys count too; Off = never slows down or stops for animals (animals covered by the player's “Avoid animals” are still dodged at speed). Default = Large animals
    -- 1 = Off
    -- 2 = Large animals
    -- 3 = All animals
MinidoracatAutoDrive.AnimalSlowdown=2

# What auto-drive does when the route ahead is blocked.
# Dodge (default) steers around the obstacle, onto the shoulder or grass if needed. If the whole road is blocked, it stops, checks open ground up to about 13 m on either side, and goes around off the road (when towing, it also checks that the trailer fits). It only stops for good when there is no way around.
# Stop means it always slows down and stops, handing control back to the player. Most conservative.
# Takes effect as soon as an admin clicks Apply. Default = Dodge
    -- 1 = Dodge
    -- 2 = Stop
MinidoracatAutoDrive.ObstaclePolicy=1

# How far auto-drive keeps to the right, scaled by the width of the road it is on: 1.0 (default) drives in the middle of the right-hand lane; 0.5 stays in the right lane but closer to the center line; 2.0 keeps as far right as possible; 0 disables it and drives along the middle of the route.
# Narrow roads are handled automatically without running onto the curb. When an oncoming vehicle crosses into its lane, auto-drive moves further right to pass; if there is no room on the right, it slows down and stops to let the other vehicle through.
# Takes effect the next time auto-drive is started after an admin clicks Apply. Min: 0.00 Max: 2.00 Default: 1.00
MinidoracatAutoDrive.RightLaneBias=1.0

# How far (in tiles) a player can be from a vehicle with an Autopilot Module and still summon it from a compatible mod's phone app. 0 turns summon off.
