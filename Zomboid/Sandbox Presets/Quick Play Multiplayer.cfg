# Allow players to share custom roads with their faction or safehouse. The server keeps shared roads in its own file, and members' navigation uses them directly. On by default. When disabled the server rejects new shares and stops sending shared roads; roads already saved stay in the server file.
MinidoracatMiniMap.AllowRoadShare=true

# Let players share cleared resource points and search progress with their faction or safehouse. Either way, the server keeps each player's marks in its own files and still detects chunks that were reset or regenerated. On by default. When disabled, marks are no longer sent to other players.
MinidoracatMiniMap.AllowClearedShare=true

# Allow players to share their world map sketches with their faction or safehouse. The server keeps shared sketches in its own files, and offline members receive them when they log in. On by default. When disabled the server rejects new shares and stops sending shared sketches; sketches already saved stay in the server files.
MinidoracatMiniMap.AllowSketchShare=true

# Adds facing arrows and view cones to other players on the mini-map and the world map: Off / Faction & safehouse / Everyone on the map. Only nearby players are drawn, and never anyone the vanilla map hides (vanilla server option MapRemotePlayerVisibility). Default = Faction & safehouse
    -- 1 = Off
    -- 2 = Faction & safehouse
    -- 3 = Everyone on the map
MinidoracatMiniMap.RemoteFacingDisplay=2

# When on, players can tell other floors apart on the mini-map and the world map: other players on another floor get a different arrow, and zombie dots on other floors fade. On by default; which floor a player is on is useful intel, so PVP servers may want to turn it off. For players it only applies to those "Other players' facing" already shows. Multiplayer only; single player always allows it.
MinidoracatMiniMap.AllowFloorMarks=true

# Off by default.
# When on, an admin who holds the CanSeeAll capability can enable Tactical View from the minimap settings window and temporarily ignore these server-wide limits: zombie dots, zombie heatmap, animal icons, vehicle icons, and the zombie / animal / vehicle / POI / custom zone display distances plus the global distance cap.
# Three conditions must all hold: this option on, the player holds CanSeeAll, and the player turns the switch on themselves (off by default, never automatic).
# Never affected by this option (always the server setting): safehouse areas and livestock visibility (those belong to the privacy override), faction target sharing, player position export.
# The switch lives only on that player's machine; it affects nobody else and is never written into the server settings.
# Takes effect as soon as the admin clicks Apply.
MinidoracatMiniMap.AllowAdminTacticalView=false

# Off by default. Does nothing unless Allow admin tactical view override is also on.
# When on, an admin can add Privacy View on top of Tactical View and temporarily ignore the limits that hide other players' private information: safehouse area / name display and their distance limits, livestock icon visibility.
# Four conditions must all hold: both admin options on, the player holds CanSeeAll, and the player turns on both Tactical View and Privacy View themselves.
# Turning Tactical View off also disables Privacy View.
# Faction target sharing and player position export are never part of any override.
# Recommended only for short periods, e.g. handling a dispute or helping recover livestock.
# Takes effect as soon as the admin clicks Apply.
MinidoracatMiniMap.AllowAdminPrivacyView=false

# Allow players to show real-time zombie positions within the mini-map view. When disabled, the feature is turned off for every player (admin changes apply live).
MinidoracatMiniMap.AllowZombieDots=false

# 0 = no distance limit.
# N > 0 = show only items within N tiles of the player.
# One tile is about one metre; distance is 2D and ignores floors.
# Admin changes take effect immediately after Apply. Min: 0 Max: 10000 Default: 0
MinidoracatMiniMap.ZombieDotDistance=0

# 0 = real time (default; refreshes about every 0.3 seconds).
# N > 0 = zombie dots refresh only every N seconds and are scanned around the player, so panning the map does not rescan.
# Affects zombie dots only; the zombie heatmap is drawn by the game.
# Admins using Tactical view always see real time.
# Scanning runs on each player's client, so this does not change server load. Min: 0 Max: 3600 Default: 0
MinidoracatMiniMap.ZombieScanInterval=0

# Allow players to overlay the zombie population heatmap on the mini-map. When disabled it is force-hidden (admin changes apply live).
MinidoracatMiniMap.AllowZombieIntensity=false

# Allow players to draw NPCs (from mods such as Bandits or Project A-Life) in their own color among the zombie dots. When disabled, NPCs still appear as ordinary zombie dots. Admins with tactical view are not affected.
MinidoracatMiniMap.AllowNpcDotColor=true

# Allow players to show nearby animal icons (wild and livestock) on the mini-map. When disabled, the feature is turned off for every player (admin changes apply live).
MinidoracatMiniMap.AllowAnimalDots=false

# 0 = no distance limit.
# N > 0 = show only items within N tiles of the player.
# One tile is about one metre; distance is 2D and ignores floors.
# Admin changes take effect immediately after Apply. Min: 0 Max: 10000 Default: 0
MinidoracatMiniMap.AnimalIconDistance=0

# Controls livestock icon visibility.
# The "Skip other safehouses" mode hides livestock
# only inside other players' safehouses;
# livestock outside safehouses stays visible.
# Your safehouses are based on the animal's current location;
# you must own or be invited to that safehouse.
# This is not animal ownership or anti-cheat;
# wild animals are unaffected.
# In singleplayer, the first three modes all show livestock. Default = Skip other safehouses
    -- 1 = Show all
    -- 2 = Skip other safehouses
    -- 3 = Only your safehouses
    -- 4 = Hide all
MinidoracatMiniMap.LivestockVisibility=2

# Allow players to show nearby vehicle icons on the mini-map. When disabled, the feature is turned off for every player (admin changes apply live).
MinidoracatMiniMap.AllowVehicleDots=false

# 0 = no distance limit.
# N > 0 = show only items within N tiles of the player.
# One tile is about one metre; distance is 2D and ignores floors.
# Admin changes take effect immediately after Apply. Min: 0 Max: 10000 Default: 0
MinidoracatMiniMap.VehicleIconDistance=0

# 0 = real time (default; refreshes about every 0.5 seconds).
# N > 0 = vehicle and animal icons refresh only every N seconds and are scanned around the player, so panning the map does not rescan.
# Admins using Tactical view always see real time.
# Scanning runs on each player's client, so this does not change server load. Min: 0 Max: 3600 Default: 0
MinidoracatMiniMap.VehicleAnimalScanInterval=0

# 0 = no distance limit (default).
# N > 0 = a resource point (blocks, outlines and icon) is shown only
# when the nearest point of its displayed rooms is within N tiles
# of the player.
# One tile is about one metre; 300 is a good starting value
# (roughly a city block cluster) that preserves exploration.
# Affects built-in resource points and the parking lot layer;
# map-pack outlines and other layers are unaffected.
# Distance is 2D and ignores floors.
# Admin changes take effect immediately after Apply. Min: 0 Max: 10000 Default: 0
MinidoracatMiniMap.PoiDisplayDistance=0

# How resource points are marked for players whose mini-map
# "Marking method" stays on "Server setting" (the default).
# By main use (default): each building gets one main use,
# and small rooms inside homes are left out; covers
# the vanilla map and the map mods in a map pack.
# By room: a building is marked if any one of its rooms is of that
# type, can be in several types, and every map mod is covered.
# It marks more places (a home bar in a house is marked as Food / Dining).
# Both go by room names, not the vanilla map's building colors.
# Unless "Players only use the default marking" is checked,
# players can still pick the other method in their own settings.
# Admin changes take effect immediately after Apply. Default = By main use
    -- 1 = By main use
    -- 2 = By room
MinidoracatMiniMap.PoiSourceDefault=1

# When checked, every player uses the method chosen in
# "Default resource point marking" above.
# Players' own "Marking method" setting turns grey and can't be changed;
# their choice is kept and comes back when this is unchecked.
# Off by default. Admin changes take effect immediately after Apply.
MinidoracatMiniMap.PoiSourceLock=false

# 0 = no distance limit (default).
# N > 0 = a custom zone (supplied by a zone-layer add-on,
# such as server regions) is shown only when its nearest point
# is within N tiles of the player (fill, border, name and icon
# are hidden together).
# Only affects the custom zone layer; resource points and
# map-pack outlines are unaffected.
# Players can further tighten this with their own slider
# (the smaller value wins).
# One tile is about one metre; distance is 2D and ignores floors.
# Admin changes take effect immediately after Apply. Min: 0 Max: 10000 Default: 0
MinidoracatMiniMap.ZoneDisplayDistance=0

# When on, players can see the outline and name of each enabled map MOD on the mini-map and world map (needs the map pack). On by default; when off, nobody sees them and players' own switches are greyed out (admin changes apply live).
MinidoracatMiniMap.AllowMapBounds=true

# Controls safehouse area outlines and icons on players' mini-map and world map: off / own only / all (including other players') / own and faction members'. PVP servers may prefer "Own only" or "Own and faction" to avoid leaking enemy base locations. Default = All
    -- 1 = Off
    -- 2 = Own only
    -- 3 = All
    -- 4 = Own and faction
MinidoracatMiniMap.SafehouseDisplay=3

# 0 = no distance limit.
# N > 0 = show an outline only when its nearest point
# is within N tiles of the player.
# A player's own safehouses (owner or member) are always shown.
# One tile is about one metre; distance is 2D and ignores floors.
# Admin changes take effect immediately after Apply.
# This only controls outline visibility.
# It does not affect livestock ownership or privacy checks. Min: 0 Max: 10000 Default: 0
MinidoracatMiniMap.SafehouseDisplayDistance=0

# Controls safehouse names (the safehouse title) on players' mini-map and world map: off / own only / all / own and faction members'. When a name differs from the owner's username (e.g. a custom name), the owner's username is appended in parentheses. Independent from the area display, so areas can be shown without names. Default = All
    -- 1 = Off
    -- 2 = Own only
    -- 3 = All
    -- 4 = Own and faction
MinidoracatMiniMap.SafehouseNameDisplay=3

# 0 = no distance limit.
# N > 0 = show a name only when the area's nearest point
# is within N tiles of the player.
# A player's own safehouses (owner or member) are always shown.
# Independent from the outline distance. One tile is about one metre;
# distance is 2D and ignores floors.
# Admin changes take effect immediately after Apply. Min: 0 Max: 10000 Default: 0
MinidoracatMiniMap.SafehouseNameDistance=0

# Write player positions to a JSON file for external tools (off by default).
# Output goes to Zomboid/Lua/MinidoracatMiniMap/ as players_SAVENAME.json (multiplayer = server name, singleplayer = save folder name), next to poi_blocks.json.
# Purpose: a map-reset tool can check whether anyone is inside an area before wiping it, and kick those players first if needed.
# Contents: player name, world position, floor, online flag, observation time.
# Note: positions are written to disk - enable this only when the server is actually paired with such a tool.
# Admin changes take effect immediately after Apply.
MinidoracatMiniMap.ExportPlayerPositions=false

# How often the player position file is rewritten, in seconds (default 5).
# Only matters when Export player position file is enabled.
# The write is small; 5 seconds is negligible for the server.
# Higher values save I/O but leave external tools with older positions - reset tools use the in-file timestamp to judge freshness and refuse to act on stale data.
# Admin changes take effect immediately after Apply. Min: 1 Max: 300 Default: 5
MinidoracatMiniMap.PlayerExportInterval=5

# Besides online players, write the last observed position of offline players into the same file.
# Reset tools use it to skip areas where a character logged out - those characters are still standing there when they next log in.
# Note: the offline list is only the subset this mod observed (characters who logged out before it started recording never appear). Use it to confirm that someone IS there, never to prove that nobody is.
# When disabled, only online players are exported.
# Admin changes take effect immediately after Apply.
MinidoracatMiniMap.ExportOfflinePlayers=true

# When enabled, Neat Crafting uses ingredients and tools directly from accessible containers instead of transferring them to the character's main inventory first. This differs from vanilla Crafting behavior and can make some crafting actions faster. Default: Off.
NeatCrafting.CraftDirectFromAccessibleContainers=true

# Vanilla default is 10, which is an entire welding torch. Min: 0 Max: 100 Default: 10
NepWrecks.FuelUsed=10

# If disabled you can use Safety Squints instead of a welding mask
NepWrecks.NeedMask=true

# Mutliplies the amount of items created by salvaging Min: 0.00 Max: 100.00 Default: 1.00
NepWrecks.LootMult=1.0

# Prints additional debugging data to console
NepWrecks.DebugMode=false

# How often the character stumbles while running and looking back. A glance of about a second is safe, after that the risk grows over three seconds up to this rate and stays there. Looking ahead again lets it fade. <LINE> 15 is roughly one fall per minute of looking back, 100 is one every ten seconds, 1000 is one a second. Zero never falls. Min: 0.00 Max: 1000.00 Default: 100.00
OverTheShoulder.RunTripChance=50.0

# The same for a sprint. Min: 0.00 Max: 1000.00 Default: 180.00
OverTheShoulder.SprintTripChance=100.0

# The rates above are for a character with no skill. Each level of Sprinting cuts them by 6%, each level of Fitness by 4%, so level ten in both removes falls entirely. Graceful halves the rate, Clumsy raises it by half. <LINE> Off, the rates work exactly as set, skills and traits are ignored.
OverTheShoulder.TripSkillScaling=true

# Helmets, goggles, gas masks and other worn items that narrow the field of view also shorten how far you can see behind you when looking over the shoulder. <LINE> Off, looking back reaches behind you whatever you wear. The normal field of view is narrowed by them as usual.
OverTheShoulder.WornItemsLimitLook=false

# Holding the look over the shoulder for long makes the neck stiff and sore. A quick glance and the first three seconds are free. <LINE> 1 is the normal rate, 2 twice as fast, 0.5 half as fast. Zero turns neck pain off. Min: 0.00 Max: 10.00 Default: 1.00
OverTheShoulder.NeckStrainFactor=0.0

# Degrees the edge of the field of view goes past the line straight behind you when looking back. <LINE> 0 stops right at your back, 10 shows a little more of the other side. At night a small margin helps the area straight behind stay visible. Min: 0 Max: 10 Default: 5
OverTheShoulder.BackMargin=5

